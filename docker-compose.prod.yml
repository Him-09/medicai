# ============================================================
#  MedicAI — Production Docker Compose
# ============================================================
#
#  Usage:
#    1. Copy .env.production → .env and fill in real values
#    2. docker compose -f docker-compose.prod.yml build
#    3. docker compose -f docker-compose.prod.yml run --rm migrate
#    4. docker compose -f docker-compose.prod.yml up -d
#
# ============================================================

services:
  # ─────────────────────────────────────────
  #  PostgreSQL 16 + pgvector
  # ─────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: medicai-db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - medicai_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - internal

  # ─────────────────────────────────────────
  #  Database Migrations (one-shot container)
  # ─────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: medicai-migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "run_all_migrations.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  # ─────────────────────────────────────────
  #  Backend — FastAPI / Uvicorn
  # ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: medicai-backend
    container_name: medicai-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      MFA_REQUIRED: ${MFA_REQUIRED:-true}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEFAULT_TEXT_MODEL: ${DEFAULT_TEXT_MODEL:-gpt-4o}
      DEFAULT_VISION_MODEL: ${DEFAULT_VISION_MODEL:-gpt-4o}
      AI_ENABLED: ${AI_ENABLED:-true}
      ALLOWED_ORIGINS: "https://${DOMAIN},http://${DOMAIN},http://68.183.220.108"
      # Voice / LiveKit
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY}
      PYTHONPATH: /app
      LOG_LEVEL: INFO
    volumes:
      - uploads:/app/data
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal

  # ─────────────────────────────────────────
  #  Voice Agent — LiveKit Agent Worker
  # ─────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: medicai-agent
    container_name: medicai-agent
    restart: unless-stopped
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BACKEND_URL: http://backend:8000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHONPATH: /app
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # ─────────────────────────────────────────
  #  Frontend — Next.js (standalone)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:-68.183.220.108}
    container_name: medicai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  # ─────────────────────────────────────────
  #  Nginx — Reverse Proxy + TLS termination
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: medicai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - internal

  # ─────────────────────────────────────────
  #  Certbot — Automatic SSL renewal
  # ─────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: medicai-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

# ─────────────────────────────────────────
#  Named Volumes
# ─────────────────────────────────────────
volumes:
  medicai_pgdata:
  uploads:
  backups:
  certbot_conf:
  certbot_www:

# ─────────────────────────────────────────
#  Internal Network
# ─────────────────────────────────────────
networks:
  internal:
    driver: bridge
