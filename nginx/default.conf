# ============================================================
#  MedicAI — Nginx Reverse Proxy Configuration
# ============================================================
#
#  HTTP-only config for IP-based access.
#  When you have a domain + SSL cert, uncomment the HTTPS block.
#
# ============================================================

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# ── HTTP server (IP-based access) ──
server {
    listen 80;
    server_name _;

    # Let's Encrypt / Certbot challenge (for future SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Security headers ──
    add_header X-Frame-Options        DENY            always;
    add_header X-Content-Type-Options nosniff         always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # ── Upload size (for medical documents) ──
    client_max_body_size 50M;

    # ── /api/* → FastAPI backend ──
    #    Preserves /api prefix — backend routes are mounted at /api/*
    location /api/ {
        proxy_pass http://backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (voice / scribe)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout  60s;
        proxy_read_timeout    3600s;
        proxy_send_timeout     60s;
    }

    # ── Everything else → Next.js frontend ──
    location / {
        proxy_pass http://frontend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

