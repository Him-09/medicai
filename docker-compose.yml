services:
  db:
    image: postgres:16
    container_name: medicai-db
    environment:
      # Use environment variables for security - set these in .env file
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medicai
    ports:
      # Only expose to localhost in production
      - "127.0.0.1:5432:5432"
    volumes:
      - medicai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medicai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Security: Limit container resources
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  medicai_pgdata:
